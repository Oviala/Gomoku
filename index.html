<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>五子棋 · 正在进入</title>
<style>
  :root { color-scheme: dark; }
  body {
    margin: 0; min-height: 100vh; display: grid; place-items: center;
    background: radial-gradient(900px 600px at 50% 30%, #4a2412, #150b04 72%);
    color: #f2d98a; font-family: "Songti SC", "STSong", serif; text-align: center;
  }
  .box { padding: 30px 22px; }
  h1 { font-size: 34px; letter-spacing: 12px; text-indent: 12px; margin: 0 0 12px; }
  p { color: #bda98a; font-size: 13px; letter-spacing: 2px; line-height: 2; margin: 6px 0; }
  .spinner {
    width: 30px; height: 30px; margin: 26px auto 0; border-radius: 50%;
    border: 2px solid rgba(242, 217, 138, 0.22); border-top-color: #f2d98a;
    animation: spin 0.9s linear infinite;
  }
  @keyframes spin { to { transform: rotate(360deg); } }
  a { color: #f2d98a; }
  #manual { display: none; }
  #manual a { display: block; font-size: 12px; word-break: break-all; }
</style>
</head>
<body>
  <div class="box">
    <h1>五子棋</h1>
    <p id="tip">正在进入棋局…</p>
    <div class="spinner" id="spin"></div>
    <p id="manual">跳转失败？<span id="links"></span></p>
  </div>

<script>
  /* ============================================================
   * 房主注意：这一行由 tools/set_link.sh 自动维护 —— 最近几个隧道地址，
   * 越新越靠前；页面会逐个探测 /api/health，挑一个活的跳过去。
   * 一般不用手改；真要手改，保持 ["url1", "url2"] 这种格式即可。
   * ============================================================ */
  const TARGETS = ["https://da68a9817bf15497-203-198-123-238.serveousercontent.com", "https://adc3d8e13e6cd057-203-198-123-238.serveousercontent.com", "https://063ed41f07151b60-220-246-101-116.serveousercontent.com"];

  (function () {
    var tip = document.getElementById("tip");
    var manual = document.getElementById("manual");
    var links = document.getElementById("links");
    var spinner = document.getElementById("spin");
    var suffix = location.search + location.hash;
    var bases = (TARGETS || [])
      .map(function (t) { return String(t || "").trim().replace(/\/+$/, ""); })
      .filter(function (t) { return /^https?:\/\//.test(t) && t.indexOf("REPLACE-ME") === -1; });

    // 手动兜底：把候选地址都列出来，隧道全挂时至少能自己试
    links.innerHTML = "";
    bases.forEach(function (base, i) {
      var a = document.createElement("a");
      a.href = base + "/" + suffix;
      a.textContent = (i === 0 ? "最新地址 " : "备用地址 ") + base;
      links.appendChild(a);
    });

    if (!bases.length) {
      tip.textContent = "房主还没配置地址";
      spinner.style.display = "none";
      manual.style.display = "block";
      return;
    }

    function probe(base) {
      // 探测隧道是否活着（服务端给了 CORS，跨域也能读）
      return new Promise(function (resolve) {
        var ctl = window.AbortController ? new AbortController() : null;
        var timer = setTimeout(function () {
          if (ctl) ctl.abort();
          resolve(false);
        }, 2500);
        fetch(base + "/api/health?_=" + Date.now(), {
          mode: "cors",
          cache: "no-store",
          signal: ctl ? ctl.signal : undefined,
        })
          .then(function (r) { return r.ok ? r.json() : null; })
          .then(function (j) {
            clearTimeout(timer);
            resolve(!!(j && j.ok));
          })
          .catch(function () {
            clearTimeout(timer);
            resolve(false);
          });
      });
    }

    (async function () {
      for (var i = 0; i < bases.length; i++) {
        tip.textContent = i === 0 ? "正在进入棋局…" : "最新地址没响应，试备用地址…";
        if (await probe(bases[i])) {
          location.replace(bases[i] + "/" + suffix);
          return;
        }
      }
      // 都探测失败：可能是探测被网络/跨域挡住，但页面本身能开 —— 直接试最新的
      tip.textContent = "正在尝试最新地址…";
      location.replace(bases[0] + "/" + suffix);
      setTimeout(function () {
        spinner.style.display = "none";
        manual.style.display = "block";
      }, 4000);
    })();
  })();
</script>
</body>
</html>
